name: muhammad_assadullah
description: A personal portfolio Flutter web app
publish_to: 'none'

environment:
  sdk: '>=2.18.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  shared_preferences: ^2.1.1
  url_launcher: ^6.1.10
  js: ^0.6.7
  firebase_core: ^2.30.0
  firebase_auth: ^4.17.0
  cloud_firestore: ^4.15.0
  lottie: ^2.4.0
  rive: ^0.13.20
  visibility_detector: ^0.4.0
  google_fonts: ^6.0.0
  flutter_animate: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/projects/
    - assets/animations/
    - assets/icons/
